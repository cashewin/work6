name: 🎬 Create Video

on:
  repository_dispatch:
    types: [create_video]

jobs:
  create-video:
    runs-on: ubuntu-latest

    container:
      image: docker.io/cashewin/video-tools:latest
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      options: --user 0

    defaults:
      run:
        shell: bash

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Prepare assets from payload
        run: |
          set -euo pipefail
          mkdir -p assets output /tmp

          echo "================================================"
          echo "🎬 VIDEO CREATION STARTING (9:16 Vertical)"
          echo "================================================"

          echo '${{ toJson(github.event.client_payload.images) }}' > /tmp/images.json

          idx=0
          while IFS= read -r image_url; do
            if [ -n "$image_url" ] && [ "$image_url" != "null" ]; then
              outfile="assets/image_$(printf '%03d' "$idx").png"
              echo "📥 Downloading image $((idx + 1)): $image_url"
              curl -L --fail --retry 3 -o "$outfile" "$image_url"
              idx=$((idx + 1))
            fi
          done < <(jq -r '.[]?' /tmp/images.json)

          echo "📊 Total images: $idx"
          ls -lh assets/

          if [ -n "${{ github.event.client_payload.voiceover_url || '' }}" ]; then
            echo "🎤 Downloading voiceover..."
            curl -L --fail --retry 3 --retry-delay 2 -o assets/voiceover_raw "${{ github.event.client_payload.voiceover_url }}"
            
            # Check if the file is already encoded audio using ffprobe
            if ffprobe -v error -select_streams a -show_entries stream=codec_name -of csv=p=0 assets/voiceover_raw >/dev/null 2>&1; then
              # Already encoded (MP3, AAC, WAV, etc.) - just rename
              mv assets/voiceover_raw assets/voiceover.mp3
              echo "✅ Audio file ready (already encoded)"
            else
              # Raw PCM data - convert to MP3
              echo "🔄 Converting PCM to MP3..."
              # PCM format: 16-bit signed little-endian, 24kHz, mono
              ffmpeg -y -f s16le -ar 24000 -ac 1 -i assets/voiceover_raw \
                -c:a libmp3lame -b:a 192k -ar 48000 \
                assets/voiceover.mp3
              
              if [ $? -ne 0 ]; then
                echo "❌ PCM to MP3 conversion failed"
                exit 1
              fi
              
              rm assets/voiceover_raw
              echo "✅ PCM to MP3 conversion complete"
            fi
            
            # Validate the converted/downloaded audio file
            echo "🔍 Validating audio file..."
            VO_STREAMS=$(ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 assets/voiceover.mp3 2>/dev/null | wc -l)
            VO_DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 assets/voiceover.mp3 2>/dev/null)
            
            if [ $VO_STREAMS -eq 0 ]; then
              echo "❌ Voiceover file has no audio streams!"
              exit 1
            elif ! [[ "$VO_DUR" =~ ^[0-9]+\.?[0-9]*$ ]] || [ -z "$VO_DUR" ]; then
              echo "❌ Voiceover has invalid duration: $VO_DUR"
              exit 1
            elif (( $(echo "$VO_DUR < 0.1" | bc -l) )); then
              echo "❌ Voiceover duration too short: ${VO_DUR}s"
              exit 1
            fi
            
            echo "✅ Audio validation passed: ${VO_DUR}s duration"
            
            # Log audio details for troubleshooting
            echo "📊 Voiceover details:"
            ffprobe -v error -show_entries format=duration:stream=codec_name,sample_rate,channels -of default=noprint_wrappers=1 assets/voiceover.mp3
          fi

          if [ -n "${{ github.event.client_payload.background_music_url || '' }}" ]; then
            echo "🎵 Downloading background music..."
            curl -L --fail --retry 3 --retry-delay 2 -o assets/bgmusic.mp3 "${{ github.event.client_payload.background_music_url }}"
          fi

      - name: 📝 Save subtitle text
        if: github.event.client_payload.subtitle_text != '' && github.event.client_payload.subtitle_text != null
        run: |
          cat > /tmp/subtitle_text.txt <<'EOF'
          ${{ github.event.client_payload.subtitle_text }}
          EOF

      - name: 🎞️ Create vertical video (9:16) for Instagram Reels / YouTube Shorts
        run: |
          set -euo pipefail
          
          echo "================================================"
          echo "🎥 VIDEO CREATION - VERTICAL FORMAT (1080x1920)"
          echo "================================================"
          
          # Get actual voiceover duration for proper video length
          DURATION=30
          if [ -f assets/voiceover.mp3 ]; then
            RAW_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 assets/voiceover.mp3)
            # Check if duration is a valid number (not N/A or empty)
            if [[ "$RAW_DURATION" =~ ^[0-9]+\.?[0-9]*$ ]] && [ -n "$RAW_DURATION" ]; then
              DURATION=$(printf "%.0f" "$RAW_DURATION")
              echo "🎤 Detected voiceover duration: ${DURATION}s"
            else
              echo "⚠️  Could not detect voiceover duration (got: $RAW_DURATION), using default: ${DURATION}s"
            fi
          else
            echo "⏱️  Using default duration: ${DURATION}s"
          fi
          
          # Count images (no pre-processing needed - filter_complex handles it)
          IMG_COUNT=$(ls -1 assets/image_*.png 2>/dev/null | wc -l)
          
          if [ "$IMG_COUNT" -eq 0 ]; then
            echo "❌ No images found to process!"
            exit 1
          fi
          
          # Calculate per-image duration and transitions
          TRANSITION_DURATION=0.5
          DURATION_PER_IMAGE=$(echo "scale=2; ($DURATION + ($IMG_COUNT - 1) * $TRANSITION_DURATION) / $IMG_COUNT" | bc)
          
          echo "📊 Images: $IMG_COUNT"
          echo "📐 Resolution: 1080x1920 (9:16)"
          echo "⏱️  Total duration: ${DURATION}s"
          echo "🎬 Duration per image: ${DURATION_PER_IMAGE}s"
          echo "🔀 Transition: ${TRANSITION_DURATION}s"

          # Build complex filter for smooth transitions and zoom
          FILTER_COMPLEX=""
          
          # First, scale and add zoom effect to each image (vertical format)
          for i in $(seq 0 $((IMG_COUNT - 1))); do
            FILTER_COMPLEX="${FILTER_COMPLEX}[${i}:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30,zoompan=z='min(zoom+0.0015,1.05)':d=${DURATION_PER_IMAGE}*30:s=1080x1920:fps=30[v${i}];"
          done
          
          # Add crossfade transitions between images
          FILTER_COMPLEX="${FILTER_COMPLEX}[v0]"
          for i in $(seq 1 $((IMG_COUNT - 1))); do
            OFFSET=$(echo "scale=2; $i * ($DURATION_PER_IMAGE - $TRANSITION_DURATION)" | bc)
            FILTER_COMPLEX="${FILTER_COMPLEX}[v${i}]xfade=transition=fade:duration=${TRANSITION_DURATION}:offset=${OFFSET}"
            if [ $i -lt $((IMG_COUNT - 1)) ]; then
              FILTER_COMPLEX="${FILTER_COMPLEX}[vt${i}];[vt${i}]"
            fi
          done
          FILTER_COMPLEX="${FILTER_COMPLEX}[vout]"

          # Build input string with proper paths
          INPUTS=""
          for i in $(seq 0 $((IMG_COUNT - 1))); do
            INPUTS="$INPUTS -i assets/image_$(printf '%03d' $i).png"
          done

          echo "🎬 Creating vertical slideshow with smooth transitions and zoom..."
          ffmpeg -y $INPUTS -filter_complex "$FILTER_COMPLEX" -map "[vout]" \
            -c:v libx264 -pix_fmt yuv420p -preset faster -crf 23 \
            -movflags +faststart -t $DURATION \
            output/temp.mp4

          echo "✅ Base vertical video created"

          # Generate subtitles with perfect audio sync if subtitle text is provided
          if [ -f /tmp/subtitle_text.txt ]; then
            echo "📝 Generating movie-quality subtitles with perfect audio sync..."
            SUBTITLE_TEXT=$(cat /tmp/subtitle_text.txt)
            
            # Split text into words for timing calculation
            WORD_COUNT=$(echo "$SUBTITLE_TEXT" | wc -w)
            
            if [ "$WORD_COUNT" -gt 0 ]; then
              # Calculate precise timing - each word gets equal time based on total duration
              SECONDS_PER_WORD=$(echo "scale=4; $DURATION / $WORD_COUNT" | bc)
              
              echo "📊 Words: $WORD_COUNT | Rate: ${SECONDS_PER_WORD}s/word"
              
              # Generate SRT file with 4-6 words per subtitle (prevents overflow, perfect for vertical video)
              > output/subs.srt
              WORDS=($SUBTITLE_TEXT)
              SUBTITLE_NUM=1
              CURRENT_TIME=0
              WORDS_PER_SUBTITLE=5
              
              for ((i=0; i<${#WORDS[@]}; i+=WORDS_PER_SUBTITLE)); do
                # Get chunk of words
                CHUNK="${WORDS[@]:i:WORDS_PER_SUBTITLE}"
                CHUNK_WORD_COUNT=$(echo "$CHUNK" | wc -w)
                
                # Calculate precise timing for this chunk
                START_TIME=$CURRENT_TIME
                CHUNK_DURATION=$(echo "scale=4; $CHUNK_WORD_COUNT * $SECONDS_PER_WORD" | bc)
                END_TIME=$(echo "scale=4; $START_TIME + $CHUNK_DURATION" | bc)
                
                # Format times to SRT format (HH:MM:SS,mmm) with high precision
                format_time() {
                  local seconds=$1
                  local h=$(echo "$seconds / 3600" | bc)
                  local m=$(echo "($seconds % 3600) / 60" | bc)
                  local s=$(echo "$seconds % 60" | bc)
                  local int_s=${s%.*}
                  local ms=$(echo "($s - $int_s) * 1000" | bc)
                  printf "%02d:%02d:%02d,%03d" ${h:-0} ${m:-0} ${int_s:-0} ${ms%.*}
                }
                
                # Write SRT entry with precise timing
                echo "$SUBTITLE_NUM" >> output/subs.srt
                echo "$(format_time $START_TIME) --> $(format_time $END_TIME)" >> output/subs.srt
                echo "$CHUNK" >> output/subs.srt
                echo "" >> output/subs.srt
                
                SUBTITLE_NUM=$((SUBTITLE_NUM + 1))
                CURRENT_TIME=$END_TIME
              done
              
              echo "✅ Subtitle file created with $((SUBTITLE_NUM - 1)) entries (perfectly synced)"
              
              # Apply MULTILINGUAL subtitles for supported languages
              # Using Noto Sans Bold which supports all 6 application languages
              # English, Hindi (हिन्दी), Spanish, French, German, Russian (Русский)
              # Alignment=2 (bottom-center) with MarginV=45 for proper bottom placement
              # Check if video has audio stream to avoid time_base errors
              HAS_AUDIO_SUB=$(ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 output/temp.mp4 2>/dev/null | wc -l)
              if [ $HAS_AUDIO_SUB -gt 0 ]; then
                # Video has audio, copy it
                ffmpeg -y -i output/temp.mp4 \
                  -vf "subtitles=output/subs.srt:force_style='FontName=Noto Sans,Bold=1,FontSize=12,PrimaryColour=&HFFFFFF&,OutlineColour=&H000000&,BackColour=&H80000000&,BorderStyle=4,Outline=2,Shadow=0,MarginV=45,Alignment=2'" \
                  -c:a copy -c:v libx264 -preset faster -crf 23 output/temp_subs.mp4
              else
                # Video has no audio yet, don't try to copy audio stream
                ffmpeg -y -i output/temp.mp4 \
                  -vf "subtitles=output/subs.srt:force_style='FontName=Noto Sans,Bold=1,FontSize=12,PrimaryColour=&HFFFFFF&,OutlineColour=&H000000&,BackColour=&H80000000&,BorderStyle=4,Outline=2,Shadow=0,MarginV=45,Alignment=2'" \
                  -c:v libx264 -preset faster -crf 23 output/temp_subs.mp4
              fi
              mv output/temp_subs.mp4 output/temp.mp4
              echo "✅ Multilingual subtitles applied for: English, Hindi, Spanish, French, German, Russian"
            fi
          fi

          # Add voiceover - NO -shortest flag to preserve full audio
          if [ -f assets/voiceover.mp3 ]; then
            echo "🎤 Validating and adding voiceover..."
            
            # Validate voiceover audio has valid streams and duration
            VO_AUDIO_STREAMS=$(ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 assets/voiceover.mp3 2>/dev/null | wc -l)
            VO_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 assets/voiceover.mp3 2>/dev/null)
            
            if [ $VO_AUDIO_STREAMS -eq 0 ]; then
              echo "⚠️  Voiceover file has no audio streams - skipping"
            elif ! [[ "$VO_DURATION" =~ ^[0-9]+\.?[0-9]*$ ]] || [ -z "$VO_DURATION" ]; then
              echo "⚠️  Voiceover has invalid duration ($VO_DURATION) - skipping"
            elif (( $(echo "$VO_DURATION < 0.1" | bc -l) )); then
              echo "⚠️  Voiceover duration too short (${VO_DURATION}s) - skipping"
            else
              echo "✅ Voiceover validated: ${VO_DURATION}s duration"
              
              # Re-encode voiceover to ensure clean AAC format with proper metadata
              echo "🔧 Re-encoding voiceover for compatibility..."
              ffmpeg -y -i assets/voiceover.mp3 \
                -c:a aac -b:a 192k -ar 48000 -ac 2 \
                assets/voiceover_clean.aac
              
              # Validate the re-encoded AAC file
              AAC_STREAMS=$(ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 assets/voiceover_clean.aac 2>/dev/null | wc -l)
              AAC_DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 assets/voiceover_clean.aac 2>/dev/null)
              
              if [ $AAC_STREAMS -eq 0 ] || ! [[ "$AAC_DUR" =~ ^[0-9]+\.?[0-9]*$ ]] || (( $(echo "$AAC_DUR < 0.1" | bc -l) )); then
                echo "❌ Re-encoded AAC is invalid (streams: $AAC_STREAMS, duration: $AAC_DUR)"
                exit 1
              fi
              echo "✅ Re-encoded AAC validated: ${AAC_DUR}s"
              
              # Now add the clean voiceover to video
              ffmpeg -y -i output/temp.mp4 -i assets/voiceover_clean.aac \
                -map 0:v -map 1:a \
                -c:v copy -c:a copy \
                -movflags +faststart \
                output/temp_vo.mp4
              mv output/temp_vo.mp4 output/temp.mp4
              echo "✅ Voiceover added"
            fi
          fi

          # Add background music with proper mixing
          if [ -f assets/bgmusic.mp3 ]; then
            echo "🎵 Validating and adding background music..."
            
            # Validate background music has valid streams and duration
            BG_AUDIO_STREAMS=$(ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 assets/bgmusic.mp3 2>/dev/null | wc -l)
            BG_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 assets/bgmusic.mp3 2>/dev/null)
            
            if [ $BG_AUDIO_STREAMS -eq 0 ]; then
              echo "⚠️  Background music has no audio streams - skipping"
            elif ! [[ "$BG_DURATION" =~ ^[0-9]+\.?[0-9]*$ ]] || [ -z "$BG_DURATION" ]; then
              echo "⚠️  Background music has invalid duration ($BG_DURATION) - skipping"
            elif (( $(echo "$BG_DURATION < 0.1" | bc -l) )); then
              echo "⚠️  Background music duration too short (${BG_DURATION}s) - skipping"
            else
              echo "✅ Background music validated: ${BG_DURATION}s duration"
              
              # Re-encode background music to ensure clean AAC format
              echo "🔧 Re-encoding background music for compatibility..."
              ffmpeg -y -i assets/bgmusic.mp3 \
                -c:a aac -b:a 192k -ar 48000 -ac 2 \
                assets/bgmusic_clean.aac
              
              # Validate the re-encoded AAC file
              BG_AAC_STREAMS=$(ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 assets/bgmusic_clean.aac 2>/dev/null | wc -l)
              BG_AAC_DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 assets/bgmusic_clean.aac 2>/dev/null)
              
              if [ $BG_AAC_STREAMS -eq 0 ] || ! [[ "$BG_AAC_DUR" =~ ^[0-9]+\.?[0-9]*$ ]] || (( $(echo "$BG_AAC_DUR < 0.1" | bc -l) )); then
                echo "❌ Re-encoded background music AAC is invalid (streams: $BG_AAC_STREAMS, duration: $BG_AAC_DUR)"
                exit 1
              fi
              echo "✅ Re-encoded background music validated: ${BG_AAC_DUR}s"
              
              HAS_AUDIO=$(ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 output/temp.mp4 2>/dev/null | wc -l)
              
              if [ $HAS_AUDIO -gt 0 ]; then
                # Mix: 80% voiceover + 20% background music
                ffmpeg -y -i output/temp.mp4 -i assets/bgmusic_clean.aac \
                  -filter_complex "[1:a]volume=0.2[bg];[0:a][bg]amix=inputs=2:duration=first:dropout_transition=2[a]" \
                  -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k \
                  -movflags +faststart \
                  output/temp_music.mp4
              else
                # Just add background music at 40%
                ffmpeg -y -i output/temp.mp4 -i assets/bgmusic_clean.aac \
                  -filter_complex "[1:a]volume=0.4[a]" \
                  -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k \
                  -movflags +faststart \
                  output/temp_music.mp4
              fi
              
              if [ -f output/temp_music.mp4 ] && [ -s output/temp_music.mp4 ]; then
                mv output/temp_music.mp4 output/temp.mp4
                echo "✅ Background music added"
              fi
            fi
          fi

          # Final output with optimization
          OUTPUT_NAME=${{ github.event.client_payload.output_name || 'output.mp4' }}
          # Check if video has audio for final encoding
          HAS_AUDIO_FINAL=$(ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 output/temp.mp4 2>/dev/null | wc -l)
          if [ $HAS_AUDIO_FINAL -gt 0 ]; then
            # Video has audio
            ffmpeg -y -i output/temp.mp4 \
              -c:v libx264 -preset faster -crf 23 \
              -c:a aac -b:a 192k \
              -movflags +faststart \
              "output/$OUTPUT_NAME"
          else
            # Video has no audio (video-only)
            ffmpeg -y -i output/temp.mp4 \
              -c:v libx264 -preset faster -crf 23 \
              -movflags +faststart \
              "output/$OUTPUT_NAME"
          fi

          echo "================================================"
          echo "✅ VERTICAL VIDEO CREATED SUCCESSFULLY!"
          echo "================================================"
          ls -lh "output/$OUTPUT_NAME"
          
          # Show final video info
          echo ""
          echo "📊 Final Video Info:"
          FINAL_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "output/$OUTPUT_NAME" 2>/dev/null || echo "unknown")
          if [[ "$FINAL_DURATION" =~ ^[0-9]+\.?[0-9]*$ ]]; then
            FINAL_DURATION_ROUNDED=$(printf "%.1f" "$FINAL_DURATION")
            echo "⏱️  Duration: ${FINAL_DURATION_ROUNDED}s"
          else
            echo "⏱️  Duration: ${FINAL_DURATION}"
          fi
          echo "📐 Resolution: 1080x1920 (9:16 vertical)"
          FINAL_SIZE=$(ls -lh "output/$OUTPUT_NAME" | awk '{print $5}')
          echo "📦 Size: $FINAL_SIZE"

      - name: 🎨 Apply watermark (if enabled)
        if: github.event.client_payload.watermark_enabled == 'true' || github.event.client_payload.watermark_enabled == true
        run: |
          set -euo pipefail
          
          echo "================================================"
          echo "🎨 APPLYING WATERMARK TO VIDEO"
          echo "================================================"
          
          OUTPUT_NAME=${{ github.event.client_payload.output_name || 'output.mp4' }}
          INPUT_VIDEO="output/$OUTPUT_NAME"
          WATERMARKED_VIDEO="output/${OUTPUT_NAME%.mp4}_watermarked.mp4"
          
          WATERMARK_TYPE="${{ github.event.client_payload.watermark_type || 'text' }}"
          WATERMARK_POSITION="${{ github.event.client_payload.watermark_position || 'bottom-right' }}"
          WATERMARK_OPACITY="${{ github.event.client_payload.watermark_opacity || '70' }}"
          
          if [ "$WATERMARK_TYPE" = "text" ]; then
            # Text watermark
            WATERMARK_TEXT="${{ github.event.client_payload.watermark_text || 'YourBrand' }}"
            WATERMARK_FONTSIZE="${{ github.event.client_payload.watermark_fontsize || '48' }}"
            WATERMARK_COLOR="${{ github.event.client_payload.watermark_color || '#FFFFFF' }}"
            
            # Convert hex color to ffmpeg format (0xRRGGBB)
            FFMPEG_COLOR="${WATERMARK_COLOR#\#}"
            FFMPEG_COLOR="0x${FFMPEG_COLOR}"
            
            # Calculate opacity for ffmpeg (0-1 scale)
            OPACITY=$(echo "scale=2; $WATERMARK_OPACITY / 100" | bc)
            
            # Calculate position coordinates
            case "$WATERMARK_POSITION" in
              "top-left")
                X_POS="20"
                Y_POS="20"
                ;;
              "top-right")
                X_POS="(w-text_w-20)"
                Y_POS="20"
                ;;
              "bottom-left")
                X_POS="20"
                Y_POS="(h-text_h-20)"
                ;;
              "bottom-right")
                X_POS="(w-text_w-20)"
                Y_POS="(h-text_h-20)"
                ;;
              "center")
                X_POS="(w-text_w)/2"
                Y_POS="(h-text_h)/2"
                ;;
              *)
                X_POS="(w-text_w-20)"
                Y_POS="(h-text_h-20)"
                ;;
            esac
            
            # Escape special characters in text for ffmpeg
            ESCAPED_TEXT=$(echo "$WATERMARK_TEXT" | sed "s/'/\\\\'/g" | sed "s/:/\\\\:/g")
            
            echo "📝 Text watermark: $WATERMARK_TEXT"
            echo "📐 Position: $WATERMARK_POSITION"
            echo "🎨 Color: $WATERMARK_COLOR"
            echo "📏 Font size: $WATERMARK_FONTSIZE"
            echo "👁️  Opacity: ${WATERMARK_OPACITY}%"
            
            # Apply text watermark
            ffmpeg -y -i "$INPUT_VIDEO" \
              -vf "drawtext=text='${ESCAPED_TEXT}':fontsize=${WATERMARK_FONTSIZE}:fontcolor=${FFMPEG_COLOR}@${OPACITY}:x=${X_POS}:y=${Y_POS}" \
              -c:a copy \
              -movflags +faststart \
              "$WATERMARKED_VIDEO"
              
          elif [ "$WATERMARK_TYPE" = "image" ]; then
            # Image watermark
            WATERMARK_URL="${{ github.event.client_payload.watermark_image_url }}"
            WATERMARK_SCALE="${{ github.event.client_payload.watermark_scale || '20' }}"
            
            if [ -z "$WATERMARK_URL" ]; then
              echo "❌ Image watermark URL not provided"
              exit 1
            fi
            
            echo "📥 Downloading watermark image..."
            curl -L --fail --retry 3 -o assets/watermark.png "$WATERMARK_URL"
            
            # Calculate opacity for ffmpeg (0-1 scale)
            OPACITY=$(echo "scale=2; $WATERMARK_OPACITY / 100" | bc)
            
            # Calculate overlay position
            case "$WATERMARK_POSITION" in
              "top-left")
                OVERLAY_POS="x=20:y=20"
                ;;
              "top-right")
                OVERLAY_POS="x=W-w-20:y=20"
                ;;
              "bottom-left")
                OVERLAY_POS="x=20:y=H-h-20"
                ;;
              "bottom-right")
                OVERLAY_POS="x=W-w-20:y=H-h-20"
                ;;
              "center")
                OVERLAY_POS="x=(W-w)/2:y=(H-h)/2"
                ;;
              *)
                OVERLAY_POS="x=W-w-20:y=H-h-20"
                ;;
            esac
            
            echo "🖼️  Image watermark from URL"
            echo "📐 Position: $WATERMARK_POSITION"
            echo "📏 Scale: ${WATERMARK_SCALE}%"
            echo "👁️  Opacity: ${WATERMARK_OPACITY}%"
            
            # Apply image watermark with scaling and opacity
            ffmpeg -y -i "$INPUT_VIDEO" -i assets/watermark.png \
              -filter_complex "[1:v]scale=iw*${WATERMARK_SCALE}/100:-1,format=rgba,colorchannelmixer=aa=${OPACITY}[wm];[0:v][wm]overlay=${OVERLAY_POS}" \
              -c:a copy \
              -movflags +faststart \
              "$WATERMARKED_VIDEO"
          else
            echo "❌ Invalid watermark type: $WATERMARK_TYPE"
            exit 1
          fi
          
          # Replace original video with watermarked version
          if [ -f "$WATERMARKED_VIDEO" ] && [ -s "$WATERMARKED_VIDEO" ]; then
            mv "$WATERMARKED_VIDEO" "$INPUT_VIDEO"
            echo "✅ Watermark applied successfully!"
            
            WATERMARKED_SIZE=$(ls -lh "$INPUT_VIDEO" | awk '{print $5}')
            echo "📦 Watermarked video size: $WATERMARKED_SIZE"
          else
            echo "❌ Failed to create watermarked video"
            exit 1
          fi

      - name: 📤 Upload video to backend via webhook
        id: upload_video
        if: success() && github.event.client_payload.callback_url != '' && github.event.client_payload.callback_url != null
        run: |
          echo "================================================"
          echo "📤 UPLOADING VIDEO TO BACKEND"
          echo "================================================"
          
          OUTPUT_NAME=${{ github.event.client_payload.output_name || 'output.mp4' }}
          VIDEO_FILE="output/$OUTPUT_NAME"
          CALLBACK_URL="${{ github.event.client_payload.callback_url }}"
          JOB_ID="${{ github.event.client_payload.job_id }}"
          
          if [ ! -f "$VIDEO_FILE" ]; then
            echo "❌ Video file not found: $VIDEO_FILE"
            exit 1
          fi
          
          VIDEO_SIZE=$(wc -c < "$VIDEO_FILE")
          VIDEO_SIZE_MB=$(echo "scale=2; $VIDEO_SIZE / 1024 / 1024" | bc)
          
          echo "📦 File: $VIDEO_FILE"
          echo "📊 Size: ${VIDEO_SIZE_MB} MB"
          echo "🔗 Webhook URL: $CALLBACK_URL"
          echo "🆔 Job ID: $JOB_ID"
          echo "🔐 Run ID: ${{ github.run_id }}"
          echo ""
          
          echo "📡 Uploading video with multipart/form-data..."
          
          RESPONSE=$(curl -X POST "$CALLBACK_URL" \
            -F "video=@$VIDEO_FILE" \
            -F "status=success" \
            -F "run_id=${{ github.run_id }}" \
            -F "job_id=$JOB_ID" \
            -F "webhook_secret=${{ secrets.WEBHOOK_SECRET }}" \
            --max-time 120 \
            --retry 3 \
            --retry-delay 5 \
            -w "\n📊 HTTP Status: %{http_code}\n" \
            -s)
          
          echo "$RESPONSE"
          
          # Check if upload was successful
          if echo "$RESPONSE" | grep -q '"message":"Webhook processed successfully"'; then
            echo "✅ Video uploaded successfully!"
            echo "upload_success=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Upload response: $RESPONSE"
            echo "❌ Video upload failed - will save as artifact for debugging"
            echo "upload_success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: 🗑️ Delete all video, images, audio, and logs (always)
        if: always()
        run: |
          echo "================================================"
          echo "🗑️  CLEANING UP ALL FILES"
          echo "================================================"
          
          # Delete generated video
          OUTPUT_NAME=${{ github.event.client_payload.output_name || 'output.mp4' }}
          if [ -f "output/$OUTPUT_NAME" ]; then
            rm -f "output/$OUTPUT_NAME"
            echo "✅ Deleted video: output/$OUTPUT_NAME"
          fi
          
          # Delete all temporary and generated files
          echo "🗑️  Removing all images, audio, temporary files, and logs..."
          rm -rf output/* 2>/dev/null || true
          rm -rf assets/* 2>/dev/null || true
          rm -rf fixed/* 2>/dev/null || true
          rm -rf /tmp/*.json 2>/dev/null || true
          rm -rf /tmp/*.txt 2>/dev/null || true
          rm -rf /tmp/*.log 2>/dev/null || true
          rm -rf /tmp/*.mp3 2>/dev/null || true
          rm -rf /tmp/*.mp4 2>/dev/null || true
          rm -rf /tmp/*.png 2>/dev/null || true
          rm -rf /tmp/*.jpg 2>/dev/null || true
          rm -rf /tmp/*.aac 2>/dev/null || true
          rm -rf /tmp/*.srt 2>/dev/null || true
          rm -rf /tmp/ffmpeg*.log 2>/dev/null || true
          rm -rf /tmp/upload_response.txt 2>/dev/null || true
          
          echo "✅ Deleted:"
          echo "   - Video files (output/*.mp4)"
          echo "   - Downloaded images (assets/*.png)"
          echo "   - Processed images (fixed/*.png)"
          echo "   - Audio files (assets/*.mp3, *.aac)"
          echo "   - Subtitle files (*.srt)"
          echo "   - All temporary files and logs"
          echo ""
          echo "📝 No files saved to GitHub repository (all deleted immediately)"
